# docker-compose.yml - CNC Guard
# Arrancar los 4 servicios: docker compose up -d kafka nifi elasticsearch kibana

services:

  # -- Kafka (KRaft, sin zookeeper) --
  kafka:
    image: apache/kafka:3.9.0
    container_name: cnc-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://${VM_IP}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped

  # -- Filebeat --
  filebeat:
    image: docker.elastic.co/beats/filebeat:9.1.4
    container_name: cnc-filebeat
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - filebeat-data:/usr/share/filebeat/data
      - cnc-stream-cifs:/mnt/cnc-stream:ro
    depends_on:
      - kafka
    restart: unless-stopped
  # -- NiFi --
  nifi:
    image: apache/nifi:2.4.0
    container_name: cnc-nifi
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: adminpassword123
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      NIFI_WEB_PROXY_HOST: localhost:8443,${VM_IP}:8443
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 2g
    depends_on:
      - kafka
    restart: unless-stopped

  # -- Elasticsearch --
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    container_name: cnc-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # -- Kibana --
  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.4
    container_name: cnc-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # -- Scoring API (fase 3) --
  scoring-api:
    build:
      context: ./scoring
    container_name: cnc-scoring
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    environment:
      MODEL_PATH: /models/cnc_failure_model.pkl
    restart: unless-stopped

  # -- Editor web (VS Code en el navegador) para el equipo --
  editor:
    image: lscr.io/linuxserver/code-server:latest
    container_name: cnc-editor
    ports:
      - "8444:8443"
      - "8001:8000"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Madrid
      PASSWORD: cncguard2026
      DEFAULT_WORKSPACE: /config/workspace/cnc-guard
    volumes:
      - ./:/config/workspace/cnc-guard
    restart: unless-stopped
volumes:
  filebeat-data:
  es-data:
  cnc-stream-cifs:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.75.150/cnc-stream"
      o: "username=cncuser,password=cncuser,ro,vers=3.0,cache=none,actimeo=0,nohandlecache"
