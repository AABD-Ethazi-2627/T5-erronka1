services:
  kibana:
    ports: !reset []
  kibana-auth:
    image: python:3.12-alpine
    container_name: cnc-kibana-auth
    command: ["python", "-u", "/app/app.py"]
    volumes:
      - ./kibana-proxy/app.py:/app/app.py:ro
      - ./kibana-proxy/.authhash:/auth/.authhash:ro
    restart: unless-stopped
  kibana-proxy:
    image: nginx:1.27-alpine
    container_name: cnc-kibana-proxy
    ports:
      - "5601:80"
    volumes:
      - ./kibana-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./kibana-proxy/gate.js:/etc/nginx/gate/gate.js:ro
    depends_on:
      - kibana
      - kibana-auth
    restart: unless-stopped