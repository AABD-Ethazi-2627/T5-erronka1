# CNC Guard - Filebeat Konfigurazioa

# 1. SARRERA
filebeat.inputs:
  - type: filestream
    id: cnc-stream
    paths:
      - /mnt/cnc-stream/*.csv
    exclude_lines: ['^timestamp']
    # Ficheros de 850 bytes: sin huella (fingerprint), se identifican por ruta
    prospector.scanner.fingerprint.enabled: false
    file_identity:
      path: ~

# 2. IRTEERA
output.kafka:
  hosts:
    - "kafka:9092"
  topic: "cnc-sensors-raw"
  codec.format:
    string: '%{[message]}'

# 3. ERREGISTROA
logging.level: info
logging.to_files: false
